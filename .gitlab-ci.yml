stages:
  - style
  - sonar
  - publish

.base:
  image: docker.app.betfair/appsec/base/python:3.13-slim-bookworm-latest
  before_script:
    - uv sync --frozen --group dev

style:
  extends: .base
  stage: style
  script:
    - make style_check
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

sonar:
  stage: sonar
  image:
    name: docker.app.betfair/appsec/sonar-scanner-cli:latest
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
    GIT_STRATEGY: clone
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - sonar-scanner
      -Dsonar.buildString=${CI_COMMIT_SHA:0:8}
      -Dsonar.scanner.truststorePath=/etc/pki/ca-trust/extracted/java/cacerts
      -Dsonar.scanner.truststorePassword=changeit
      -Dsonar.qualitygate.wait=true
  rules:
    - if: $CI_COMMIT_REF_NAME == 'main' || $CI_PIPELINE_SOURCE == 'merge_request_event'

publish:
  stage: publish
  image: docker.app.betfair/appsec/base/python:3.13-slim-bookworm-latest
  script:
    - uv build
    - uv publish --index artifactory
  rules:
    - if: $CI_COMMIT_TAG
