[build-system]
requires = ["uv_build>=0.7,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "apitokens"
module-root = ""

[project]
name = "django-apitokens"
version = "0.1.0"
description = "Generate API tokens for django-restframework"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "PPB - InfoSec Engineering", email = "surface@paddypowerbetfair.com" }]
requires-python = ">=3.12"
keywords = ["django", "api", "restframework", "tokens", "self-service"]
dependencies = [
    "Django>=5.0,<7.0",
    "django-rest-knox==4.2.0",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Django",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Environment :: Web Environment",
    "Topic :: Software Development",
]

[dependency-groups]
dev = [
    "pytest>=7.4",
    "pytest-django>=4.7",
    "ruff>=0.4",
    "Django>=5.0,<7.0",
    "django-rest-knox==4.2.0",
]

[[tool.uv.index]]
name = "artifactory"
url = "https://artifactory-prd.prd.betfair/artifactory/api/pypi/pypi/simple/"
publish-url = "https://artifactory-prd.prd.betfair/artifactory/api/pypi/pypi-local/"
default = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "testapp.settings"
python_files = ["tests.py", "test_*.py"]
pythonpath = ["testapp"]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    ".git",
    "__pycache__",
    "venv",
    ".venv",
    "migrations",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.format]
quote-style = "preserve"
